<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유안이 도형 성장 연구소</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fc;color:#1c2b43;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;padding:14px}main{max-width:720px;margin:auto}h1{font-size:25px;margin:10px 0}p{line-height:1.6}.muted{color:#52637a;font-size:14px}.card{background:white;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 10px #1e3b6410}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#e8effa;border-radius:20px;padding:9px;font-size:13px;font-weight:700}.boards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.board{border-radius:14px;background:#f3f7ff;text-align:center;padding:10px;min-width:0}.board svg{width:100%;max-width:200px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:12px;background:#dce9ff;color:#173b70;font-size:16px;font-weight:700;padding:14px 9px;min-height:48px;cursor:pointer}button.primary{background:#2569cf;color:white}button.secondary{background:#e9edf3;color:#27364b}button:disabled{opacity:.45}button.wide{grid-column:1/-1}.option{display:block;width:100%;margin:8px 0;text-align:left}#feedback{background:#fff5dd;border-radius:12px;padding:13px;margin-top:12px;min-height:48px;line-height:1.6}#progress{height:10px;border-radius:10px;background:#e4e9f3;overflow:hidden;margin:12px 0}#bar{height:100%;width:0;background:#3b86dc;transition:width .2s}pre{white-space:pre-wrap;word-break:keep-all;font:inherit;line-height:1.7}h2{font-size:20px}#history{font-size:14px}.hidden{display:none!important}
</style></head><body><main><h1>유안이 도형 성장 연구소</h1><p class="muted">생각하고, 움직이고, 스스로 성장하는 도형 학습</p><section id="home" class="card"><h2 id="homeTitle">학습 시작</h2><p id="homeDesc"></p><div id="homeStats" class="stats"></div><div class="controls" style="margin-top:16px"><button id="start" class="primary wide">시작하기</button><button id="showHistory" class="secondary wide">지난 학습 기록</button><button id="reviewOpen" class="secondary wide">지난 문제 다시 보기</button><button id="netsOpen" class="secondary wide">초5 심화 · 정육면체 전개도 탐험</button><button id="mixOpen" class="primary wide">도형 사고력 도전 · 5가지 유형</button></div><div id="history" class="hidden"></div></section>
<section id="play" class="hidden"><div class="stats"><span id="stage" class="pill"></span><span id="counter" class="pill"></span><span id="moves" class="pill"></span></div><div id="progress"><div id="bar"></div></div><div class="card"><h2 id="question"></h2><div id="visual" class="hidden"><div class="boards"><div class="board"><b>내 도형</b><svg viewBox="0 0 200 200"><path id="mine" fill="#4489e4" stroke="#2363ae" stroke-width="3"/></svg></div><div class="board"><b>목표 도형</b><svg viewBox="0 0 200 200"><path id="goal" fill="#5ebc88" stroke="#2c875c" stroke-width="3"/></svg></div></div><div class="controls" id="transformButtons"><button data-op="L">왼쪽 90°</button><button data-op="R">오른쪽 90°</button><button data-op="X">좌우 뒤집기</button><button data-op="Y">상하 뒤집기</button><button id="check" class="primary wide">같은 모양인지 확인</button><button id="reset" class="secondary">처음 모양</button><button id="hint">힌트 보기</button></div></div><div id="choices" class="hidden"></div><div id="feedback" aria-live="polite">문제를 읽고 풀어 보자!</div><div class="controls" style="margin-top:12px"><button id="skip" class="secondary wide">잘 모르겠어요, 다음 문제</button><button id="continue" class="primary wide hidden">다음 문제</button></div></div></section>
<section id="result" class="card hidden"><h2>유안이의 성장 보고서</h2><div id="childReport"></div><div class="controls"><button id="share" class="primary wide">아빠에게 카톡 보내기</button><button id="next" class="wide">다음 학습 시작</button><button id="again" class="secondary wide">보고서 닫기</button></div><details style="margin-top:14px"><summary>아빠용 상세 기록 보기</summary><pre id="parentReport"></pre></details><button id="reviewResult" class="secondary wide">이번 문제 다시 보기</button></section><section id="review" class="card hidden"><h2>문제 다시 보기</h2><p id="reviewInfo"></p><div id="reviewNumbers" class="controls"></div><h2 id="reviewQ"></h2><div id="reviewShapes" class="boards"><div class="board">내 도형<svg viewBox="0 0 200 200"><path id="reviewMine" fill="#4489e4"/></svg></div><div class="board">목표 도형<svg viewBox="0 0 200 200"><path id="reviewGoal" fill="#5ebc88"/></svg></div></div><div id="reviewOps" class="controls"><button data-r="L">왼쪽 90°</button><button data-r="R">오른쪽 90°</button><button data-r="X">좌우 뒤집기</button><button data-r="Y">상하 뒤집기</button></div><div id="reviewChoices"></div><p id="reviewFeedback"></p><div class="controls"><button id="reviewCheck">확인하기</button><button id="reviewReset">처음부터</button><button id="reviewAnswer">정답 보기</button><button id="reviewBack" class="primary">돌아가기</button></div></section><section id="nets" class="card hidden"><h2>정육면체 전개도 탐험 <small style="font-size:12px;color:#63758d">3D v3</small></h2><p>6개의 정사각형을 접으면 정육면체가 될까? 맞는 전개도를 찾아 11가지를 모아 보자.</p><div class="stats"><span id="netsProgress" class="pill"></span><span id="netsCount" class="pill"></span></div><div id="netsBoard" style="display:grid;grid-template-columns:repeat(5,44px);gap:3px;justify-content:center;margin:20px auto"></div><p id="netsFeedback" aria-live="polite">접었을 때 면이 겹치지 않을지 생각해 보자.</p><div class="controls"><button id="netsYes" class="primary">접을 수 있어</button><button id="netsNo">접을 수 없어</button><button id="netsFold" class="secondary wide" disabled>3D 접기 보기 (답을 선택하세요)</button><button id="netsNext" class="secondary wide hidden">다음 전개도</button><button id="netsHome" class="secondary wide">홈으로 돌아가기</button></div><div id="foldPanel" class="hidden" style="padding:12px;background:#f3f7ff;border-radius:14px;margin:12px 0"><h3>실제 전개도 접기 (수정 5)</h3><p class="muted">같은 번호의 면이 움직여. 막대를 움직여 접는 과정을 확인해 봐.</p><svg id="foldSvg" viewBox="0 0 360 310" style="width:100%;background:white;border-radius:12px" role="img" aria-label="전개도를 접는 3차원 모형"></svg><label for="foldRange" style="display:block;margin:10px 0">접기 진행률 <strong id="foldPercent">0%</strong></label><input id="foldRange" type="range" min="0" max="100" value="0" step="1" style="width:100%;height:40px"><div class="controls"><button id="foldStart">펼친 모습</button><button id="foldEnd" class="primary">완전히 접기</button></div><p id="foldExplanation" class="muted"></p></div><h3>찾은 전개도</h3><div id="netsFound" class="stats"></div></section><section id="mix" class="card hidden"><h2>도형 사고력 도전</h2><p id="mixProgress" class="muted"></p><h2 id="mixQuestion"></h2><div id="mixDiagram" style="overflow:auto;margin:14px 0"></div><div id="mixChoices"></div><p id="mixFeedback" aria-live="polite"></p><div class="controls"><button id="mixNext" class="primary wide hidden">다음 문제</button><button id="mixHome" class="secondary wide">홈으로</button></div></section></main><script>
(function(){
"use strict";
const KEY="yuan-math-v3";
const LEVELS=[["기초 도형과 방향","초3 수준"],["도형 돌리기와 뒤집기","초4 수준"],["도형의 성질과 복합 이동","초5 수준"],["입체도형과 공간 추론","초6 수준"]];
const base=[[44,40],[113,40],[113,74],[155,74],[155,113],[99,113],[99,159],[44,159]];
const mat={R:[0,-1,1,0],L:[0,1,-1,0],X:[-1,0,0,1],Y:[1,0,0,-1]};
const I=[1,0,0,1];
const byId=id=>document.getElementById(id);
function mul(a,b){return[a[0]*b[0]+a[1]*b[2],a[0]*b[1]+a[1]*b[3],a[2]*b[0]+a[3]*b[2],a[2]*b[1]+a[3]*b[3]]}
function trans(a,o){return mul(mat[o],a)}
function target(ops){return ops.reduce((a,o)=>trans(a,o),I)}
function path(a){return base.map((p,j)=>{let x=p[0]-100,y=p[1]-100;return(j?"L":"M")+(100+a[0]*x+a[1]*y)+","+(100+a[2]*x+a[3]*y)}).join(" ")+" Z"}
const opsText={R:"오른쪽 90도",L:"왼쪽 90도",X:"좌우 뒤집기",Y:"상하 뒤집기"};
const knowledge=[
{q:"삼각형의 변은 몇 개일까?",choices:["2개","3개","4개"],answer:1,level:0,tip:"삼각형은 세 개의 선분으로 둘러싸인 도형이야."},
{q:"정사각형의 네 각은 모두 어떤 각일까?",choices:["직각","예각","둔각"],answer:0,level:0,tip:"정사각형의 네 각은 모두 직각이야."},
{q:"직사각형의 마주 보는 변은 어떤 관계일까?",choices:["길이가 같다","항상 수직이다","길이가 다르다"],answer:0,level:0,tip:"마주 보는 변의 길이가 같아."},
{q:"도형을 오른쪽으로 90도 두 번 돌리면?",choices:["90도 회전","180도 회전","제자리"],answer:1,level:1,tip:"90도+90도는 180도야."},
{q:"좌우로 뒤집기를 두 번 하면?",choices:["처음 모양","90도 회전","상하 반전"],answer:0,level:1,tip:"거울처럼 두 번 뒤집으면 처음 모양이 돼."},
{q:"선대칭도형에서 대칭축은 무엇을 할까?",choices:["두 부분이 겹치게 나눈다","넓이를 두 배로 만든다","도형을 회전시킨다"],answer:0,level:2,tip:"대칭축을 따라 접으면 양쪽이 겹쳐."},
{q:"정사각형의 대칭축은 모두 몇 개일까?",choices:["2개","4개","6개"],answer:1,level:2,tip:"가운데를 지나는 가로, 세로, 두 대각선이야."},
{q:"정육면체의 면은 모두 몇 개일까?",choices:["4개","6개","8개"],answer:1,level:3,tip:"정육면체에는 정사각형 면이 여섯 개 있어."},
{q:"정육면체의 꼭짓점은 몇 개일까?",choices:["6개","8개","12개"],answer:1,level:3,tip:"위쪽 네 개와 아래쪽 네 개야."},
{q:"정육면체의 모서리는 몇 개일까?",choices:["8개","10개","12개"],answer:2,level:3,tip:"위 4개, 아래 4개, 연결 4개야."},
{q:"쌓기나무를 아래에 3개, 위에 1개 쌓았어. 모두 몇 개?",choices:["3개","4개","5개"],answer:1,level:3,tip:"층별 개수를 더하면 돼."},
{q:"직육면체에서 서로 마주 보는 두 면은?",choices:["항상 합동이다","항상 삼각형이다","서로 만난다"],answer:0,level:3,tip:"마주 보는 면은 크기와 모양이 같아."}
];
const transformSets=[
[["R"],["L"],["R","R"],["X"],["Y"]],
[["R"],["L"],["X"],["Y"],["R","R"]],
[["X","R"],["R","X"],["L","Y"],["R","R","X"],["Y","L"]],
[["X","R"],["L","Y"],["R","R","X"],["Y","L","X"],["R","X","R"]]
];
function sameShape(a,b){const pts=x=>base.map(p=>{const u=p[0]-100,v=p[1]-100;return (x[0]*u+x[1]*v)+","+(x[2]*u+x[3]*v)}).sort().join("|");return pts(a)===pts(b)}
function shapeQ(level,seed){const sets=transformSets[level];let ops=sets[seed%sets.length];if(sameShape(I,target(ops)))ops=["R"];return{kind:"shape",level,ops,q:level===0?"목표와 같은 모양으로 움직여 보자.":level===1?"돌리기와 뒤집기를 이용해 맞혀 보자.":level===2?"어떤 순서로 움직이면 같아질까?":"여러 번 움직이기 전에 결과를 예상해 보자.",tip:"처음 모양에서 "+ops.map(o=>opsText[o]).join(" → ")+" 순서로 해 봐."}}
function pickKnowledge(level,seed){const pool=knowledge.filter(x=>x.level===level);return{...pool[seed%pool.length],kind:"choice"}}
function buildDiagnostic(){return[shapeQ(0,0),pickKnowledge(0,0),pickKnowledge(0,1),shapeQ(1,0),shapeQ(1,2),shapeQ(1,3),pickKnowledge(1,0),shapeQ(2,0),shapeQ(2,2),pickKnowledge(2,0),pickKnowledge(2,1),pickKnowledge(3,0),pickKnowledge(3,1),pickKnowledge(3,2),shapeQ(3,3)]}
function buildSession(level,verification,cycle){const a=[];const count=verification?5:10;for(let j=0;j<count;j++){const seed=cycle*7+j+(Math.floor(Math.random()*17));a.push(j%3===2?pickKnowledge(level,seed):shapeQ(level,seed))}return a}
let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
if(!saved||!Number.isInteger(saved.level)||!Array.isArray(saved.history))saved={diagnosed:false,level:0,cycle:0,history:[],pendingVerify:false,finished:false};
let session=null,index=0,records=[],current=I,moves=0,attempts=0,hints=0,answered=false,report="";
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}}
function show(id){["home","play","result","review","nets","mix"].forEach(x=>byId(x).classList.toggle("hidden",x!==id))}
function home(){show("home");byId("homeTitle").textContent=saved.finished?"초6 수준까지 학습했어!":saved.diagnosed?"다시 만나서 반가워, 유안아!":"유안아, 먼저 실력을 알아보자!";
byId("homeDesc").textContent=saved.finished?"원하면 다시 연습할 수 있어.":saved.diagnosed?LEVELS[saved.level][0]+" 단계에서 이어서 공부할 수 있어.":"15문제를 풀고 잘하는 부분과 연습할 부분을 찾아볼 거야. 모르면 건너뛰어도 괜찮아.";
byId("start").textContent=saved.diagnosed?(saved.finished?"마지막 단계 다시 연습":"이어서 학습하기"):"진단평가 15문제 시작";
byId("homeStats").textContent="";const el=document.createElement("span");el.className="pill";el.textContent="완료한 학습 "+saved.history.length+"회";byId("homeStats").append(el)}
function start(){const diagnostic=!saved.diagnosed;const verify=!diagnostic&&saved.pendingVerify;session={diagnostic,verify,level:saved.level,questions:diagnostic?buildDiagnostic():buildSession(saved.level,verify,saved.cycle)};index=0;records=[];render()}
function render(){show("play");const q=session.questions[index];current=I;moves=0;attempts=0;hints=0;answered=false;byId("stage").textContent=session.diagnostic?"진단평가":(session.verify?"완전학습 확인":"연습")+" · "+LEVELS[q.level][0];byId("counter").textContent=(index+1)+" / "+session.questions.length;byId("bar").style.width=(index/session.questions.length*100)+"%";byId("question").textContent=q.q;byId("feedback").textContent=session.diagnostic?"힌트 없이 풀어 보자. 모르면 건너뛰어도 괜찮아.":session.verify?"스스로 생각하고 풀어 보자.":"먼저 생각하고 풀어 보자!";byId("continue").classList.add("hidden");byId("skip").classList.remove("hidden");byId("moves").textContent="조작 0회";byId("visual").classList.toggle("hidden",q.kind!=="shape");byId("choices").classList.toggle("hidden",q.kind!=="choice");byId("hint").disabled=session.diagnostic||session.verify;byId("transformButtons").querySelectorAll("button").forEach(b=>b.disabled=false);
if(q.kind==="shape"){byId("goal").setAttribute("d",path(target(q.ops)));drawShape()}else{byId("choices").textContent="";q.choices.forEach((v,j)=>{const b=document.createElement("button");b.className="option";b.textContent=(j+1)+". "+v;b.addEventListener("click",()=>choose(j));byId("choices").append(b)})}}
function drawShape(){byId("mine").setAttribute("d",path(current));byId("moves").textContent="조작 "+moves+"회"}
function finishQuestion(correct){if(answered)return;answered=true;const q=session.questions[index];records.push({level:q.level,kind:q.kind,correct,attempts,moves,hints,efficient:q.kind==="choice"||moves<=q.ops.length+1});byId("continue").classList.remove("hidden");byId("skip").classList.add("hidden");byId("transformButtons").querySelectorAll("button").forEach(b=>b.disabled=true);byId("choices").querySelectorAll("button").forEach(b=>b.disabled=true);byId("feedback").textContent=session.diagnostic?"답안을 기록했어. 다음 문제로 가자.":correct?(moves>3?"정답! 다음에는 더 적게 움직여 볼까?":"정답이야! 잘했어!"):"괜찮아! 다음 문제에서 다시 생각해 보자."}
function choose(j){if(answered)return;attempts++;const q=session.questions[index];if(j===q.answer)finishQuestion(true);else{byId("feedback").textContent=session.diagnostic||session.verify?"이번 문제는 넘어가도 괜찮아.":"다시 생각해 보자.";if(session.diagnostic||session.verify)finishQuestion(false)}}
function check(){if(answered)return;attempts++;const q=session.questions[index];if(sameShape(current,target(q.ops)))finishQuestion(true);else{byId("feedback").textContent="아직 달라. 방향을 다시 살펴보자.";if(session.diagnostic||session.verify)finishQuestion(false)}}
function complete(){const correct=records.filter(x=>x.correct).length;const independent=records.filter(x=>x.correct&&x.hints===0).length;const efficient=records.filter(x=>x.correct&&x.efficient).length;let decision="";
if(session.diagnostic){const scores=[0,0,0,0],totals=[0,0,0,0];records.forEach(r=>{totals[r.level]++;if(r.correct&&r.attempts===1)scores[r.level]++});let level=0;while(level<3&&scores[level]>=Math.ceil(totals[level]*.8))level++;saved.level=level;saved.diagnosed=true;decision="진단 완료! "+LEVELS[level][0]+"부터 시작해 보자."}
else if(session.verify){if(correct>=4&&independent>=4&&efficient>=4){if(saved.level===3){saved.finished=true;decision="초6 수준까지 완전학습을 달성했어!"}else{saved.level++;decision="완전학습 성공! 다음 단계로 올라갔어."}}else{decision="아직 연습할 부분이 있어. 새로운 문제로 다시 연습하자."}saved.pendingVerify=false;saved.cycle++}
else{if(correct>=9&&independent>=8&&efficient>=8){saved.pendingVerify=true;decision="연습 기준 통과! 다음에는 완전학습 확인 문제 5개를 풀자."}else{saved.pendingVerify=false;decision="조금 더 연습하자. 다음에는 새로운 문제가 나와."}saved.cycle++}
const item={date:new Date().toLocaleString("ko-KR"),type:session.diagnostic?"진단평가":session.verify?"확인평가":"연습",level:session.level,correct,total:records.length,independent,efficient,decision,records,questions:session.questions};saved.history.push(item);persist();
const weak=records.filter(r=>!r.correct||r.attempts>1||!r.efficient);const note=weak.length?("조금 더 연습할 문제: "+weak.map((r,j)=>records.indexOf(r)+1+"번").join(", ")):"모든 문제를 안정적으로 해결했어.";
byId("childReport").innerHTML="";const lines=["오늘 맞힌 문제: "+correct+" / "+records.length,"힌트 없이 맞힌 문제: "+independent+"개","적절한 조작으로 해결: "+efficient+"개",note,decision];lines.forEach(t=>{const p=document.createElement("p");p.textContent=t;byId("childReport").append(p)});

const NETS=[

let netOrder=[],netAt=0,netFound=new Set(),netAnswered=false;
function netCells(raw){return raw.split(" ").map(p=>p.split(",").map(Number))}

function netOpen(){const mixed=NETS.map((x,i)=>({raw:x,valid:true,id:i})).concat(NET_WRONG.map(x=>({raw:x,valid:false,id:-1})));netOrder=mixed.sort(()=>Math.random()-.5);netAt=0;netFound=new Set();netRender()}
function netRender(){show("nets");byId("foldPanel").classList.add("hidden");byId("netsFold").classList.remove("hidden");byId("netsFold").disabled=true;byId("netsFold").textContent="3D 접기 보기 (답을 선택하세요)";netAnswered=false;const item=netOrder[netAt];const pts=netCells(item.raw);const minX=Math.min(...pts.map(p=>p[0])),minY=Math.min(...pts.map(p=>p[1]));const board=byId("netsBoard");board.replaceChildren();board.style.gridTemplateColumns="repeat(6,40px)";for(let y=0;y<6;y++)for(let x=0;x<6;x++){const cell=document.createElement("div");cell.style.cssText="height:40px;border-radius:4px;"+(pts.some(p=>p[0]-minX===x&&p[1]-minY===y)?"background:#f2a8bf;border:2px solid #7e344f":"background:#f1f5fc");board.append(cell)}byId("netsProgress").textContent="문제 "+(netAt+1)+"/"+netOrder.length;byId("netsCount").textContent="서로 다른 전개도 "+netFound.size+"/11";byId("netsFeedback").textContent="이 모양을 접으면 정육면체가 될까?";byId("netsYes").disabled=false;byId("netsNo").disabled=false;byId("netsNext").classList.add("hidden");byId("netsFound").replaceChildren();[...netFound].sort((a,b)=>a-b).forEach(i=>{const chip=document.createElement("span");chip.className="pill";chip.textContent=(i+1)+"번 전개도";byId("netsFound").append(chip)})}
function netChoose(answer){if(netAnswered)return;netAnswered=true;const item=netOrder[netAt];if(item.valid)netFound.add(item.id);byId("netsFeedback").textContent=(answer===item.valid?"정답! ":"아쉬워. ")+(item.valid?"이 모양은 정육면체로 접을 수 있어.":"이 모양은 접으면 면이 겹치거나 정육면체가 되지 않아.");byId("netsYes").disabled=true;byId("netsNo").disabled=true;byId("netsFold").disabled=!item.valid;byId("netsFold").textContent=item.valid?"접는 과정 3D로 보기":"3D 접기 불가 (접히지 않는 전개도)";byId("netsCount").textContent="서로 다른 전개도 "+netFound.size+"/11";byId("netsNext").textContent=netAt===netOrder.length-1?"결과 보기":"다음 전개도";byId("netsNext").classList.remove("hidden")}
const MIX_TYPES=["정육면체 전개도","직육면체의 마주 보는 면","도형 돌리기와 뒤집기","쌓기나무","도형 규칙"];

function mixRect(x,y,color,label){return '<rect x="'+x+'" y="'+y+'" width="36" height="36" rx="2" fill="'+color+'" stroke="#25354a" stroke-width="2"/>'+(label?'<text x="'+(x+18)+'" y="'+(y+24)+'" font-size="18" text-anchor="middle" fill="#172c48">'+label+'</text>':"")}
function mixSvg(cells,labels){const xs=cells.map(p=>p[0]),ys=cells.map(p=>p[1]);const loX=Math.min(...xs),loY=Math.min(...ys),hiX=Math.max(...xs),hiY=Math.max(...ys);return '<svg role="img" aria-label="격자 도형" viewBox="0 0 '+((hiX-loX+1)*38+12)+' '+((hiY-loY+1)*38+12)+'" style="display:block;max-width:100%;max-height:240px;margin:auto">'+cells.map((p,i)=>mixRect(6+(p[0]-loX)*38,6+(p[1]-loY)*38,"#a9d3f8",labels?labels[i]:"")).join("")+'</svg>'}
function mixQuestion(t,seed){if(t===0){const valid=seed%2===0,raw=valid?NETS[seed%NETS.length]:NET_WRONG[seed%NET_WRONG.length];return{type:t,q:"이 전개도를 접으면 정육면체가 될까?",diagram:mixSvg(netCells(raw)),options:["접을 수 있다","접을 수 없다"],answer:valid?0:1,why:valid?"6개 면이 겹치지 않고 서로 다른 방향을 향해.":"접으면 면이 겹치거나 6개 면이 서로 다른 방향을 향하지 못해."}}
if(t===1){const cells=[[0,1],[1,1],[2,1],[3,1],[1,0],[1,2]],labels=["A","B","C","D","E","F"];const pairs=[["A","C"],["B","D"],["E","F"]],pair=pairs[seed%3];return{type:t,q:"아래 직육면체 전개도를 접었을 때 "+pair[0]+"면과 마주 보는 면은?",diagram:mixSvg(cells,labels),options:[pair[1],pair[0]==="E"?"A":"E",pair[0]==="B"?"C":"B"],answer:0,why:"접으면 A와 C, B와 D, E와 F가 서로 마주 봐."}}
if(t===2){const patterns=[[[0,0],[1,0],[1,1],[1,2]],[[0,0],[0,1],[1,1],[2,1]],[[0,0],[1,0],[2,0],[0,1]]];const pts=patterns[seed%3];const rotate=p=>[-p[1],p[0]],flip=p=>[-p[0],p[1]];const op=seed%2===0?rotate:flip;const targetPts=pts.map(op);const wrong=pts.map(p=>[p[0],-p[1]]);const normalize=a=>{let minX=Math.min(...a.map(p=>p[0])),minY=Math.min(...a.map(p=>p[1]));return a.map(p=>[p[0]-minX,p[1]-minY])};const key=a=>normalize(a).map(p=>p.join(",")).sort().join("|");const wrongPts=key(wrong)===key(targetPts)?pts:wrong;return{type:t,q:"왼쪽 도형을 "+(seed%2===0?"오른쪽으로 90도 돌린":"좌우로 뒤집은")+" 모양은 어느 쪽일까?",diagram:'<p>처음 도형</p>'+mixSvg(pts),options:["① "+(seed%2===0?"첫 번째":"첫 번째")+" 모양","② 두 번째 모양"],optionDiagrams:[mixSvg(seed%3===0?targetPts:wrongPts),mixSvg(seed%3===0?wrongPts:targetPts)],answer:seed%3===0?0:1,why:"도형의 칸들이 이동한 방향을 하나씩 비교해 보자."}}
if(t===3){const cols=[1+(seed%3),2+((seed+1)%3),1+((seed+2)%3)];const front=cols.map((h,i)=>Array.from({length:h},(_,j)=>[i,3-j])).flat();return{type:t,q:"앞에서 본 쌓기나무야. 각 칸의 높이만큼 한 줄로 쌓았다면 나무는 모두 몇 개일까?",diagram:mixSvg(front),options:[String(cols.reduce((a,b)=>a+b,0)),String(cols.reduce((a,b)=>a+b,0)+1),String(cols.reduce((a,b)=>a+b,0)-1)],answer:0,why:"각 기둥의 높이 "+cols.join("+")+"를 더하면 "+cols.reduce((a,b)=>a+b,0)+"개야."}}
const start=2+(seed%3),step=seed%2+1;return{type:t,q:"정사각형이 "+step+"개씩 늘어나는 규칙이야. 다음에는 몇 개일까?",diagram:'<p style="text-align:center;font-size:21px">'+[0,1,2].map(i=>"■".repeat(start+i*step)).join(" → ")+" → ?</p>",options:[String(start+3*step),String(start+2*step),String(start+4*step)],answer:0,why:"한 번에 "+step+"개씩 늘어나므로 다음은 "+(start+3*step)+"개야."}}
function mixOpen(){mixList=[];for(let round=0;round<2;round++)for(let t=0;t<5;t++)mixList.push(mixQuestion(t,round*5+t+1));mixAt=0;mixScore=0;mixRender()}
function mixRender(){show("mix");mixDone=false;const q=mixList[mixAt];byId("mixProgress").textContent="문제 "+(mixAt+1)+"/"+mixList.length+" · "+MIX_TYPES[q.type]+" · 현재 정답 "+mixScore+"개";byId("mixQuestion").textContent=q.q;byId("mixDiagram").innerHTML=q.diagram;byId("mixChoices").replaceChildren();q.options.forEach((v,i)=>{const b=document.createElement("button");b.className="option";b.textContent=v;if(q.optionDiagrams){const div=document.createElement("div");div.innerHTML=q.optionDiagrams[i];b.append(div)}b.addEventListener("click",()=>{if(mixDone)return;mixDone=true;if(i===q.answer)mixScore++;byId("mixFeedback").textContent=(i===q.answer?"정답! ":"아쉬워. 정답은 "+q.options[q.answer]+". ")+q.why;byId("mixChoices").querySelectorAll("button").forEach(x=>x.disabled=true);byId("mixNext").classList.remove("hidden");byId("mixNext").textContent=mixAt===mixList.length-1?"결과 확인":"다음 문제"});byId("mixChoices").append(b)});byId("mixFeedback").textContent="그림을 자세히 보고 답을 선택해 봐.";byId("mixNext").classList.add("hidden")}

const fAdd=(a,b)=>a.map((v,i)=>v+b[i]),fMul=(a,k)=>a.map(v=>v*k),fCross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],fDot=(a,b)=>a.reduce((t,v,i)=>t+v*b[i],0);
function fRotate(v,axis,angle){const c=Math.cos(angle),si=Math.sin(angle);return fAdd(fAdd(fMul(v,c),fMul(fCross(axis,v),si)),fMul(axis,fDot(axis,v)*(1-c)))}
function foldFaces(raw,percent){const cells=netCells(raw),set=new Map(cells.map((p,i)=>[p.join(","),i])),done=new Map(),queue=[0],ang=percent*Math.PI/2;done.set(0,{c:[0,0,0],u:[1,0,0],v:[0,1,0]});while(queue.length){const i=queue.shift(),f=done.get(i),p=cells[i];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const j=set.get([p[0]+dx,p[1]+dy].join(","));if(j===undefined||done.has(j))continue;const axis=dx?f.v:f.u,sign=dx?-dx:dy,angle=sign*ang;const u=fRotate(f.u,axis,angle),v=fRotate(f.v,axis,angle);const step=fAdd(fMul(fAdd(fMul(f.u,dx),fMul(f.v,dy)),.5),fMul(fAdd(fMul(u,dx),fMul(v,dy)),.5));done.set(j,{c:fAdd(f.c,step),u,v});queue.push(j)}}return cells.map((_,i)=>done.get(i))}
function foldDraw(){const item=netOrder[netAt];if(!item||!item.valid)return;const percent=Number(byId("foldRange").value)/100,faces=foldFaces(item.raw,percent),svg=byId("foldSvg");const project=p=>[(p[0]-p[1])*.82,(p[0]+p[1])*.5-p[2]*1.3];const polygons=faces.map((f,i)=>{const pts=[[-.5,-.5],[.5,-.5],[.5,.5],[-.5,.5]].map(([a,b])=>fAdd(f.c,fAdd(fMul(f.u,a),fMul(f.v,b))));return{pts,center:f.c,index:i,depth:f.c[0]+f.c[1]+0.77*f.c[2]}}).sort((a,b)=>a.depth-b.depth);const all=polygons.flatMap(f=>f.pts.map(project));const minX=Math.min(...all.map(p=>p[0])),maxX=Math.max(...all.map(p=>p[0])),minY=Math.min(...all.map(p=>p[1])),maxY=Math.max(...all.map(p=>p[1]));const scale=Math.min(290/Math.max(maxX-minX,.1),240/Math.max(maxY-minY,.1));const tx=x=>180+(x-(minX+maxX)/2)*scale,ty=y=>155+(y-(minY+maxY)/2)*scale;svg.replaceChildren();const ns="http://www.w3.org/2000/svg";polygons.forEach(f=>{const poly=document.createElementNS(ns,"polygon");poly.setAttribute("points",f.pts.map(p=>{const a=project(p);return tx(a[0]).toFixed(2)+","+ty(a[1]).toFixed(2)}).join(" "));poly.setAttribute("fill",["#f2abc1","#b6d7fa","#bce6cc","#ffe3a8","#d8c5f5","#f7c3a0"][f.index]);poly.setAttribute("stroke","#26374c");poly.setAttribute("stroke-width","2");poly.setAttribute("stroke-linejoin","round");svg.append(poly);const pos=project(f.center),label=document.createElementNS(ns,"text");label.setAttribute("x",tx(pos[0]));label.setAttribute("y",ty(pos[1])+5);label.setAttribute("font-size","17");label.setAttribute("font-weight","bold");label.setAttribute("text-anchor","middle");label.setAttribute("fill","#17263b");label.textContent=f.index+1;svg.append(label)});byId("foldPercent").textContent=Math.round(percent*100)+"%";byId("foldExplanation").textContent=percent===0?"문제의 전개도를 그대로 펼친 모습이야.":percent===1?"여섯 면이 만나 정육면체가 완성됐어. 각 면의 번호를 확인해 봐.":"연결된 모서리를 기준으로 각 면이 "+Math.round(percent*90)+"도씩 접히고 있어."}
