<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유안이 도형 연구소</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f4f7fc;color:#1d2b42;margin:0;padding:18px}main{max-width:680px;margin:auto}h1{font-size:26px;margin:12px 0}p{line-height:1.5}.small{color:#52637b}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.stats span{background:white;border-radius:20px;padding:10px;font-weight:700}.boards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.board{background:white;border-radius:18px;padding:10px;text-align:center;min-width:0}.board strong{font-size:16px}.board svg{width:100%;height:auto;display:block;margin:10px auto;max-width:260px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{border:0;border-radius:15px;padding:17px 8px;font-size:16px;font-weight:750;cursor:pointer;color:#16355c;background:#dbe9ff;min-height:54px}button.flip{background:#eee4ff;color:#54367d}button.check{background:#1a64d8;color:white;grid-column:1/-1}button.other{background:#e7edf5;color:#263b56}#message{background:white;border-radius:15px;padding:16px;margin-top:14px;min-height:58px;font-weight:650;line-height:1.5}#lesson{background:#fff7e6;border-left:5px solid #ffc04a;border-radius:10px;padding:12px;margin-top:14px;line-height:1.6}@media(max-width:380px){body{padding:10px}.board{padding:6px}.board strong{font-size:13px}button{font-size:14px}}
</style></head><body><main><h1>도형 움직이기 연구소</h1><p class="small">유안아, 왼쪽 도형을 돌리거나 뒤집어서 오른쪽과 똑같이 만들어 보자!</p>
<div class="stats"><span id="number">문제 1 / 10</span><span id="score">맞힌 문제 0개</span><span id="kind">연습: 돌리기</span></div>
<p id="mode" style="font-weight:700;background:#e8f1ff;padding:12px;border-radius:12px">1~5번: 자유 탐색, 마음껏 움직여 보자!</p><div class="boards"><section class="board"><strong>내가 움직이는 도형</strong><svg id="mine" viewBox="0 0 200 200" role="img" aria-label="내가 움직일 파란 도형"><path id="mineShape" fill="#3d89e5" stroke="#1e579d" stroke-width="3" stroke-linejoin="round"/></svg></section>
<section class="board"><strong>목표 도형</strong><svg id="goal" viewBox="0 0 200 200" role="img" aria-label="맞출 초록 도형"><path id="goalShape" fill="#58bb85" stroke="#267849" stroke-width="3" stroke-linejoin="round"/></svg></section></div>
<div class="buttons"><button id="left">↶ 왼쪽 90°</button><button id="right">↷ 오른쪽 90°</button><button class="flip" id="flipX">↔ 좌우 뒤집기</button><button class="flip" id="flipY">↕ 상하 뒤집기</button><button class="check" id="check">같은 모양인지 확인!</button><button class="other" id="reset">처음 모양</button><button class="other" id="hint">힌트</button></div>
<div id="message" aria-live="polite">왼쪽 도형을 움직여 보세요. 목표 도형과 방향을 비교해 보세요.</div>
<div id="lesson"><b>기억하자!</b> 돌리기는 도형을 빙글빙글 회전시키는 것이고, 뒤집기는 거울에 비춘 것처럼 방향을 바꾸는 거야.</div>
<section id="report" hidden style="background:white;border-radius:16px;padding:18px;margin-top:16px"><h2>유안이 학습 결과</h2><pre id="reportText" style="white-space:pre-wrap;font:inherit;line-height:1.7"></pre><button id="share" class="check" style="width:100%">아빠에게 결과 보내기</button><p>카카오톡을 선택하고 아빠 채팅방에 보내 주세요.</p></section></main><script>
(function(){
"use strict";
const points=[[46,40],[113,40],[113,75],[153,75],[153,112],[100,112],[100,157],[46,157]];
const questions=[
{ops:["R"],type:"돌리기"},{ops:["L"],type:"돌리기"},{ops:["R","R"],type:"돌리기"},
{ops:["X"],type:"뒤집기"},{ops:["Y"],type:"뒤집기"},{ops:["X","R"],type:"뒤집기"},
{ops:["R","X"],type:"혼합"},{ops:["L","Y"],type:"혼합"},{ops:["R","R","X"],type:"혼합"},{ops:["Y","L","X"],type:"혼합"}];
let i=0,score=0,done=false,state=identity(),attempts=0,hints=0,locked=false,moves=0,firstCorrect=false;const records=[];
function identity(){return [1,0,0,1]}
function mul(a,b){return [a[0]*b[0]+a[1]*b[2],a[0]*b[1]+a[1]*b[3],a[2]*b[0]+a[3]*b[2],a[2]*b[1]+a[3]*b[3]]}
const matrices={R:[0,-1,1,0],L:[0,1,-1,0],X:[-1,0,0,1],Y:[1,0,0,-1]};
function transform(s,op){return mul(matrices[op],s)}
function target(){return questions[i].ops.reduce((s,op)=>transform(s,op),identity())}
function path(s){return points.map((p,n)=>{const x=p[0]-100,y=p[1]-100;return (n?"L":"M")+(100+s[0]*x+s[1]*y)+","+(100+s[2]*x+s[3]*y)}).join(" ")+" Z"}
function draw(){document.getElementById("mode").textContent=i<5?"1~5번: 자유 탐색, 마음껏 움직여 보자!":"6~10번: 생각하고 풀기, 움직이기 전에 방향을 예상해 보자!";document.getElementById("mineShape").setAttribute("d",path(state));document.getElementById("goalShape").setAttribute("d",path(target()));document.getElementById("number").textContent="문제 "+(i+1)+" / 10";document.getElementById("score").textContent="맞힌 문제 "+score+"개";document.getElementById("kind").textContent="연습: "+questions[i].type}
function say(t){document.getElementById("message").textContent=t}
function makeReport(){return "유안이 도형 학습 결과\n완료: "+score+"/10문제\n정답 확인 총 "+records.reduce((n,r)=>n+r.attempts,0)+"회\n힌트 사용 문제: "+records.filter(r=>r.hints>0).length+"개\n첫 확인에 정답: "+records.filter(r=>r.attempts===1).length+"개\n"+records.map(r=>r.n+"번 ("+(r.n<=5?"탐색":"생각")+") : "+r.attempts+"회 확인, 조작 "+r.moves+"회, 힌트 "+r.hints+"회").join("\n")}
function next(){if(i===9){say("10문제 끝! "+score+"개 맞혔어! 다시 시작하려면 '처음 모양'을 눌러줘.");done=true;document.getElementById("report").hidden=false;document.getElementById("reportText").textContent=makeReport();document.getElementById("check").textContent="아빠에게 카톡 보내기";document.getElementById("reset").textContent="처음부터 풀기";return}i++;attempts=0;hints=0;moves=0;locked=false;state=identity();done=false;draw();say("좋아! 이제 다음 문제를 풀어 보자.")}
async function shareReport(){const t=makeReport();if(navigator.share){try{await navigator.share({title:"유안이 도형 학습 결과",text:t});return}catch(e){if(e.name==="AbortError")return}}try{await navigator.clipboard.writeText(t);say("결과를 복사했어! 카카오톡에 붙여넣어 보내 줘.")}catch(e){say("결과표를 길게 눌러 복사해서 보내 줘.")}}
document.getElementById("share").addEventListener("click",shareReport);
function move(op){if(done||locked)return;state=transform(state,op);moves++;draw();say("조작 "+moves+"회. 목표와 비교해 보자!")}
document.getElementById("left").addEventListener("click",()=>move("L"));
document.getElementById("right").addEventListener("click",()=>move("R"));
document.getElementById("flipX").addEventListener("click",()=>move("X"));
document.getElementById("flipY").addEventListener("click",()=>move("Y"));
document.getElementById("check").addEventListener("click",()=>{if(done){shareReport();return}if(locked)return;attempts++;if(state.every((v,j)=>v===target()[j])){locked=true;records.push({n:i+1,attempts,hints,moves});score++;draw();say(i>=5&&moves>questions[i].ops.length?"정답! 이번에는 더 적게 움직여서도 만들 수 있을까?":"정답이야! 잘했어!");setTimeout(next,1400)}else{say("아직 달라. 도형의 방향과 튀어나온 부분을 살펴봐!")}}); 
document.getElementById("hint").addEventListener("click",()=>{if(done||locked)return;hints++;const name={R:"오른쪽으로 90도",L:"왼쪽으로 90도",X:"좌우 뒤집기",Y:"상하 뒤집기"};say("힌트: 처음 모양에서 "+questions[i].ops.map(o=>name[o]).join(" → ")+"를 해 보렴.")});
document.getElementById("reset").addEventListener("click",()=>{if(done){i=0;score=0;done=false;records.length=0;document.getElementById("report").hidden=true}if(done){moves=0}if(!done)locked=false;state=identity();draw();say("처음 모양으로 돌아왔어. 다시 도전!")});draw();
})();
</script></body></html>
